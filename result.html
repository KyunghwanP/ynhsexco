<html lang="ko">

<style>
:root{
  --paper:#f7f8f7; --card:#ffffff; --ink:#13211d; --ink2:#4f615b; --ink3:#8b9995;
  --line:#dfe5e2; --line2:#c3cdc9; --trace:#0a7d5a; --trace-bg:#e3f3ec;
  --alert:#a33a1c; --amber:#8a6414;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101715; --card:#18211e; --ink:#e8efec; --ink2:#a9b8b3; --ink3:#778681;
    --line:#2a3733; --line2:#3d4d48; --trace:#3fd39b; --trace-bg:#0e2f24;
    --alert:#f0a184; --amber:#e5bd6b;
  }
}

  --paper:#101715; --card:#18211e; --ink:#e8efec; --ink2:#a9b8b3; --ink3:#778681;
  --line:#2a3733; --line2:#3d4d48; --trace:#3fd39b; --trace-bg:#0e2f24;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);

  font-size:17px;line-height:1.6;word-break:keep-all;padding:0 0 40px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
header{background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:720px;margin:0 auto;padding:14px 16px;display:flex;align-items:baseline;gap:9px}
.bar b{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.bar span{font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:20px 16px 0}
h2.sec{font-size:19px;margin:28px 0 12px;font-weight:700}

.ticket{background:var(--card);border:1.5px solid var(--trace);border-radius:16px;
  padding:22px;margin-bottom:14px}
.ticket .lbl{font-size:13px;color:var(--ink3);margin-bottom:2px}

.ecg{display:block;width:100%;height:30px;margin-bottom:16px;opacity:.85}
.agebox{background:var(--trace-bg);border-radius:14px;padding:20px;text-align:center;margin-bottom:18px}
.agebox .big{font-size:38px;font-weight:700;color:var(--trace);line-height:1.2}
.agebox .sub{font-size:14px;color:var(--ink2);margin-top:4px}
.agebox .cause{font-size:14.5px;margin-top:10px;color:var(--ink2)}
.verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}
.vc{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center}
.vc .t{font-size:13px;color:var(--ink3);margin-bottom:6px}
.vc .d{width:26px;height:26px;border-radius:50%;margin:0 auto 7px;border:1.5px solid var(--line2)}
.vc .v{font-size:14.5px;font-weight:500}
.rank{background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:16px;margin-bottom:11px}
.rank .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;gap:10px}
.rank .h b{font-size:16px;font-weight:500}
.rank .h em{font-style:normal;font-size:20px;font-weight:600;font-family:"IBM Plex Mono",monospace;color:var(--trace)}
.bar-wrap{height:9px;background:var(--line);border-radius:5px;position:relative}
.bar-me{position:absolute;top:-4px;width:4px;height:17px;background:var(--trace);border-radius:2px}
.rank .cap{font-size:13.5px;color:var(--ink3);margin-top:8px;display:flex;justify-content:space-between;gap:10px}
.ekgwave{display:block;width:100%;height:200px;border:1.5px solid var(--line);border-radius:10px}
.ekgwave.uni{height:auto}
.disclaim{font-size:15px;line-height:1.55;color:var(--ink2);text-align:center;margin-top:18px;
  background:var(--card);border:1.5px solid var(--line2);border-radius:12px;padding:15px 16px}
.disclaim b{color:var(--ink);font-weight:700}
.note{font-size:13.5px;color:var(--ink3);margin:8px 0 0;line-height:1.6}
.empty{text-align:center;padding:52px 20px;color:var(--ink3)}
.empty p{margin:0 0 6px}

/* 이름 확인 */
.gate{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px;margin-top:8px}
.gate h1{font-size:21px;margin:0 0 6px;font-weight:700}
.gate p{margin:0 0 18px;font-size:14.5px;color:var(--ink2)}
.gate label{display:block;font-size:14px;font-weight:500;margin:0 0 7px}
.gate .f{margin-bottom:16px}
input{width:100%;min-height:56px;padding:12px 14px;background:var(--paper);
  border:1.5px solid var(--line);border-radius:11px;font-family:inherit;font-size:17px;color:var(--ink)}
input:focus,button:focus-visible{outline:2.5px solid var(--trace);outline-offset:2px}
#gNo{font-family:"IBM Plex Mono",monospace;text-align:center;font-size:22px;letter-spacing:.06em}
.btn{width:100%;min-height:58px;border-radius:12px;border:1.5px solid var(--trace);
  background:var(--trace);color:#fff;font-family:inherit;font-size:17px;font-weight:500;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#06231a}}
:root[data-theme="dark"] .btn{color:#06231a}
.err{color:var(--alert);font-size:14.5px;margin:0 0 14px;min-height:21px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<main id="app"><div class="empty"><p>불러오는 중입니다…</p></div></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         collection, doc, getDoc }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCeiNE3ydmsRlb5wpdVyoKrhUQJG7bLydk",
  authDomain: "ynhs-exco.firebaseapp.com",
  projectId: "ynhs-exco",
  storageBucket: "ynhs-exco.firebasestorage.app",
  messagingSenderId: "251841405569",
  appId: "1:251841405569:web:5c18ff70f8583cfe076380"
};

/* 이 페이지는 읽기만 한다. setDoc 을 들여오지 않는 것이 그 자체로 보호 장치다. */
try{

  const db  = initializeFirestore(app, {

  });
  const col = collection(db, "records");
  window.FB = {

    one(id){ return getDoc(doc(col, id)).then(s=>s.exists()?s.data():null); },

<script>
"use strict";

/* ════════════════════════════════════════════════════════════════
   아래 블록은 index.html 과 글자 하나까지 같아야 한다.
   판정 기준이나 파형 그리기를 고칠 때 한쪽만 고치면
   번호표·결과지와 이 화면의 값이 조용히 달라진다.
   ════════════════════════════════════════════ 공유 블록 시작 ═══ */

function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function nameKey(id, name){
  const t=String(id||"").toUpperCase()+"|"+String(name||"").replace(/\s+/g,"").toLowerCase();
  let a=0x811c9dc5, b=0x01000193;
  for(let i=0;i<t.length;i++){
    const c=t.charCodeAt(i);
    a=Math.imul((a^c)>>>0, 16777619)>>>0;
    b=Math.imul((b+c)>>>0, 2654435761)>>>0;
  }
  return a.toString(16).padStart(8,"0").slice(0,4) + b.toString(16).padStart(8,"0").slice(0,4);
}

function sleepNeed(age){ return age<=12?10 : age<=18?9 : 8; }

function judge(r){
  const need=sleepNeed(r.age||17);
  const gap=need-(r.sleep??need);              // 부족 시간
  let s = gap>=2?2 : gap>=1?1 : 0;
  s = Math.min(2, Math.round((s + (r.fall??0)*0.5 + (r.wake??0)*0.5)/2 + 0.2));

  const a = Math.min(2, Math.round(((r.exer??1)+(r.sit??1)+(r.screen??1))/3 + 0.1));

  const mood=[(r.m1??2),(r.m2??2),(4-(r.m3??2))];
  const mAvg=mood.reduce((x,y)=>x+y,0)/3;
  const t = mAvg<=1.3?0 : mAvg<=2.4?1 : 2;

  return {sleep:s, act:a, stress:t};
}

function judge(r){
  const need=sleepNeed(r.age||17);
  const gap=need-(r.sleep??need);              // 부족 시간
  let s = gap>=2?2 : gap>=1?1 : 0;
  s = Math.min(2, Math.round((s + (r.fall??0)*0.5 + (r.wake??0)*0.5)/2 + 0.2));

  const a = Math.min(2, Math.round(((r.exer??1)+(r.sit??1)+(r.screen??1))/3 + 0.1));

  const mood=[(r.m1??2),(r.m2??2),(4-(r.m3??2))];
  const mAvg=mood.reduce((x,y)=>x+y,0)/3;
  const t = mAvg<=1.3?0 : mAvg<=2.4?1 : 2;

  return {sleep:s, act:a, stress:t};
}

function lifeAge(r){
  const need=sleepNeed(r.age||17), gap=need-(r.sleep??need);
  const pts=[
    gap>=2? 2 : gap>=1? 0 : -2,
    (r.exer===0?-2 : r.exer===1?0 : 2),
    (r.screen===0?-2 : r.screen===1?0 : 2),
    (r.bfast===0?-2 : r.bfast===1?0 : 2),
    (()=>{const m=((r.m1??2)+(r.m2??2)+(4-(r.m3??2)))/3; return m<=1.3?-2 : m<=2.4?0 : 2;})()
  ];
  const sum=pts.reduce((a,b)=>a+b,0);
  const diff=Math.max(-8,Math.min(8,Math.round(sum*0.8)));
  const names=["수면","운동","화면 시간","아침식사","기분"];
  let worst=-1,wi=0;
  pts.forEach((p,i)=>{ if(p>worst){worst=p;wi=i;} });
  return {diff, cause: worst>0? names[wi] : null};
}

function signedYears(d){ return d>0?`+${d}년` : d<0?`${d}년` : "±0년"; }

function ecgSvg(){
  return `<svg class="ecg" viewBox="0 0 92 34" preserveAspectRatio="none" aria-hidden="true">
    <path d="${ECG_PATH}" fill="none" stroke="var(--trace)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function rPeaks(w){
  if(!w || w.length<10) return [];
  const gap=Math.max(3, Math.round(w.length*0.04));   // 최소 간격(불응기)
  const peaks=[];
  for(let i=1;i<w.length-1;i++){
    if(w[i]>=650 && w[i]>=w[i-1] && w[i]>w[i+1]){
      if(!peaks.length || i-peaks[peaks.length-1] > gap) peaks.push(i);
    }
  }
  return peaks;
}

function ekgChart(w, opt){
  if(!w || !w.length) return "";
  const o=Object.assign({h:260, sec:null, annotate:false, zoom:false, theme:"paper"}, opt||{});
  const uniform=!!o.annotate;   // 라벨이 있으면 비율을 지켜야 글자가 안 찌그러진다

  // 박동 간격을 먼저 잡는다. 확대와 P·T 위치 계산에 함께 쓴다.
  const pk=rPeaks(w);
  let per = pk.length>1 ? pk[1]-pk[0] : Math.round(w.length/6);
  let rIdx = pk.length ? (pk.length>1?pk[1]:pk[0]) : null;
  if(o.zoom && rIdx!=null){
    const a=Math.max(0,Math.round(rIdx-per*0.40)), b=Math.min(w.length,Math.round(rIdx+per*0.60));
    if(b-a>20){ w=w.slice(a,b); rIdx-=a; }
  }
  const W=1000, H=o.h, pad=o.annotate?30:18;
  const paper = o.theme==="paper";
  const bg   = paper ? "#fff"     : "var(--card)";
  const g1   = paper ? "#f2c3bb"  : "var(--line)";
  const g2   = paper ? "#e08d7c"  : "var(--line2)";
  const ink  = paper ? "#111"     : "var(--trace)";
  const lab  = paper ? "#555"     : "var(--ink3)";
  const uid  = "ekg"+Math.random().toString(36).slice(2,8);
  const x=i=>i/(w.length-1)*W;
  const y=v=>pad+(1-v/1000)*(H-pad*2);
  let d=`M${x(0).toFixed(1)},${y(w[0]).toFixed(1)}`;
  for(let i=1;i<w.length;i++) d+=`L${x(i).toFixed(1)},${y(w[i]).toFixed(1)}`;

  let marks="";
  if(o.annotate && rIdx!=null){
    // 고정 간격으로 찍으면 사람마다 어긋난다. 창 안에서 실제 봉우리를 찾는다.
    const peakIn=(a,b)=>{
      a=Math.max(1,Math.round(a)); b=Math.min(w.length-2,Math.round(b));
      if(b<=a) return null;
      let bi=a; for(let i=a;i<=b;i++) if(w[i]>w[bi]) bi=i;
      return bi;
    };
    const pIdx=peakIn(rIdx-per*0.32, rIdx-per*0.07);
    const tIdx=peakIn(rIdx+per*0.10, rIdx+per*0.50);
    [[pIdx,"P"],[rIdx,"QRS"],[tIdx,"T"]].forEach(([i,t])=>{
      if(i==null) return;
      if(i<1||i>=w.length-1) return;
      marks+=`<line x1="${x(i).toFixed(1)}" y1="${(y(w[i])-10).toFixed(1)}" x2="${x(i).toFixed(1)}" y2="26"
                stroke="${lab}" stroke-width="1.6" stroke-dasharray="5 4"/>
              <text x="${x(i).toFixed(1)}" y="22" font-size="30" font-weight="700" fill="${lab}"
                text-anchor="middle" font-family="sans-serif">${t}</text>`;
    });
  }
  return `<svg class="ekgwave${uniform?" uni":""}" viewBox="0 0 ${W} ${H}"${uniform?"":' preserveAspectRatio="none"'}
    xmlns="http://www.w3.org/2000/svg" role="img" aria-label="심전도 파형">
    <defs>
      <pattern id="${uid}s" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M20 0H0V20" fill="none" stroke="${g1}" stroke-width="1"/></pattern>
      <pattern id="${uid}b" width="100" height="100" patternUnits="userSpaceOnUse">
        <rect width="100" height="100" fill="url(#${uid}s)"/>
        <path d="M100 0H0V100" fill="none" stroke="${g2}" stroke-width="2"/></pattern>
    </defs>
    <rect width="${W}" height="${H}" fill="${bg}"/>
    <rect width="${W}" height="${H}" fill="url(#${uid}b)"/>
    <path d="${d}" fill="none" stroke="${ink}" stroke-width="3.2"
      stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${marks}
  </svg>`;
}

function gripOf(x){
  const g=x.m&&x.m.grip;
  return (g&&g!=="skip") ? (Math.max(g.l||0,g.r||0)||null) : null;
}

function rankIn(arr,v,dir){
  if(!arr || arr.length<MIN_POOL) return null;
  const p=Math.round(arr.filter(x=>x<v).length/arr.length*100);
  return dir==="high" ? p : 100-p;
}

const GRADE=["양호","주의","관리"];

const GCOLOR=["#4fb98a","#e0b040","#d1704a"];

const ECG_PATH="M0,17 L14,17 L18,13 L22,21 L26,17 L40,17 L44,17 L47,6 L50,28 L53,17 L58,17 L64,17 L68,12 L72,17 L92,17";

const EKG_NOTE="P는 심방이 짜는 순간, 가장 뾰족한 QRS는 심실이 짜는 순간, T는 심실이 다시 쉬는 상태로 돌아가는 순간입니다.";

const EKG_CLEAN_NOTE="전기 콘센트에서 들어오는 60Hz 잡음과 숨쉬면서 생기는 흔들림을 걷어냈습니다. 없는 모양을 만들어 넣지는 않았습니다.";

const MIN_POOL=3;

/* ═══════════════════════════════════════════ 공유 블록 끝 ═══════ */

const P = new URLSearchParams(location.search);
let rec=null, pool=null;

const app=()=>document.getElementById("app");
const norm=s=>String(s||"").replace(/\s+/g,"").toLowerCase();

function showGate(id, msg){
  app().innerHTML=`<div class="gate">
    <h1>내 검진 결과 보기</h1>
    <p>번호표의 QR을 찍으면 바로 열립니다.
       QR이 잘 안 읽히면 번호표에 적힌 <b>접수번호와 이름</b>을 그대로 넣어 주세요.</p>
    <p class="err" id="gErr">${msg?escapeHtml(msg):""}</p>
    <div class="f"><label for="gNo">접수번호</label>
      <input id="gNo" value="${escapeHtml(id||"")}" autocomplete="off"
        autocapitalize="characters" spellcheck="false" maxlength="8" placeholder="A001"></div>
    <div class="f"><label for="gNm">이름</label>
      <input id="gNm" autocomplete="off" placeholder="번호표에 적힌 그대로"></div>
    <button class="btn" id="gGo">내 결과 보기</button>
  </div>`;
  const no=document.getElementById("gNo");
  no.addEventListener("input",e=>{ e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,""); });
  const go=()=>tryOpen(no.value.trim(), document.getElementById("gNm").value);
  document.getElementById("gGo").onclick=go;
  document.getElementById("gNm").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  (id?document.getElementById("gNm"):no).focus();
}

/* 번호와 이름이 둘 다 맞아야 연다. 번호만 바꿔서는 남의 결과가 열리지 않는다.
   어느 쪽이 틀렸는지는 알려주지 않는다 — 알려주면 번호를 하나씩 넣어 보며
   있는 번호를 찾아낼 수 있다. */
async function tryOpen(id, name){
  const err=document.getElementById("gErr");
  if(!id || !name){ if(err) err.textContent="접수번호와 이름을 모두 넣어 주세요"; return; }
  if(err) err.textContent="확인하는 중…";
  const r=await fetchRec(id);
  if(!r || norm(r.name)!==norm(name)){
    showGate(id, "접수번호나 이름이 맞지 않습니다");
    return;
  }
  openFor(r);
}

async function fetchRec(id){
  if(!window.FB || !window.FB.on) return null;
  try{ return await window.FB.one(String(id).toUpperCase()); }
  catch(e){ console.warn("read", e.code||e); return null; }
}

async function openFor(r){
  rec=r;
  try{ pool = await window.FB.stats(); }catch(e){ pool=null; }
  // 새로고침해도 다시 묻지 않게 주소를 열쇠 형태로 바꿔 둔다
  const k=nameKey(r.id, r.name);
  history.replaceState(null,"", location.pathname+"?r="+encodeURIComponent(r.id)+"&k="+k);
  render();
}

function render(){
  const r=rec, m=r.m||{}, j=judge(r), la=lifeAge(r);
  const p=pool||{};
  const rows=[];
  const gv=gripOf(r);
  if(gv) rows.push(["악력 (최고)", gv+" kg", rankIn(p.grip,gv,"high"), "셀수록 위쪽"]);
  if(m.reactMs) rows.push(["반응속도", m.reactMs+" ms", rankIn(p.react,m.reactMs,"low"), "빠를수록 위쪽"]);
  const bpm=(m.hr&&m.hr!=="skip")?m.hr.bpm:null;
  if(bpm) rows.push(["안정 시 심박", bpm+" BPM", rankIn(p.hr,bpm,"low"), "낮을수록 위쪽"]);
  rows.push(["생활습관 나이", signedYears(la.diff), rankIn(p.life,la.diff,"low"), "낮을수록 위쪽"]);

  let h=`<div class="ticket">
      <div class="lbl">접수번호</div><div class="num">${escapeHtml(r.id)}</div>
      <div class="who">${escapeHtml(r.name)} · ${r.age}세 · ${escapeHtml(r.sex)}</div></div>
    ${ecgSvg()}
    <div class="agebox"><div class="big">${signedYears(la.diff)}</div>
      <div class="sub">생활습관 나이 · 실제 ${r.age}세 기준</div>
      <div class="cause">${la.cause?escapeHtml(la.cause)+"이(가) 가장 많이 끌어올렸어요":"모든 항목이 좋아요"}</div></div>
    <div class="verdict">${[["수면",j.sleep],["활동",j.act],["스트레스",j.stress]].map(([t,g])=>
      `<div class="vc"><div class="t">${t}</div><div class="d" style="background:${GCOLOR[g]}"></div>
       <div class="v">${GRADE[g]}</div></div>`).join("")}</div>`;

  if(m.ekgWave && m.ekgWave.length){
    h+=`<h2 class="sec">내 심장의 전기 신호</h2>
      ${ekgChart(m.ekgWave,{theme:"screen",h:200,sec:m.ekgSec})}
      <p class="note">${m.ekgSec?`${m.ekgSec.toFixed(1)}초 구간입니다. `:""}${EKG_CLEAN_NOTE}</p>
      ${(m.ekgRaw&&m.ekgRaw.length)?`<p class="note" style="margin-top:16px">다듬기 전에는 이랬습니다.</p>
        ${ekgChart(m.ekgRaw,{theme:"screen",h:200})}`:""}
      <p class="note" style="margin-top:16px">한 박동만 크게 보면 이렇습니다.</p>
      ${ekgChart(m.ekgWave,{theme:"screen",h:340,zoom:true,annotate:true})}
      <p style="font-size:14.5px;color:var(--ink2);margin:10px 0 0;line-height:1.6">${EKG_NOTE}</p>
      <p class="note">파형은 모양만 보여 드립니다. 해석하지 않습니다.${m.ekgBpm?` 파형에서 센 심박은 ${m.ekgBpm} BPM입니다.`:""}</p>`;
  }

  h+=`<h2 class="sec">참여자 ${p.n||"—"}명 중 내 위치</h2>`;
  rows.forEach(([t,val,pc,cap])=>{
    h+=`<div class="rank"><div class="h"><b>${t}</b><em>${val}</em></div>
      <div class="bar-wrap">${pc!=null?`<div class="bar-me" style="left:calc(${Math.max(1,Math.min(99,pc))}% - 2px)"></div>`:""}</div>
      <div class="cap"><span>${cap}</span><span>${pc!=null?"상위 "+Math.max(1,100-pc)+"%":"자료를 더 모으는 중"}</span></div></div>`;
  });
  h+=`<p class="disclaim"><b>교육용 체험이며 의학적 진단이 아닙니다.</b><br>
    <b>생활습관 나이는 재미로 계산한 지수입니다.</b><br>우리가 임의로 정한 가중치로 계산했습니다.</p>`;
  app().innerHTML=h;
  scrollTo({top:0,behavior:"instant"});
}

async function start(){
  if(!window.FB || !window.FB.on){
    app().innerHTML=`<div class="empty"><p>인터넷에 연결되어야 결과를 볼 수 있습니다.</p>
      <p style="font-size:14px">연결을 확인하고 새로고침해 주세요.</p></div>`;
    return;
  }
  const id=P.get("r"), k=P.get("k");
  if(!id){ showGate("", ""); return; }
  const r=await fetchRec(id);
  // 열쇠가 맞으면 바로 연다. QR 로 들어온 경우가 이쪽이다.
  if(r && k && nameKey(r.id, r.name)===k){ rec=r; try{ pool=await window.FB.stats(); }catch(e){} render(); return; }
  showGate(id, k ? "이 주소로는 열 수 없습니다. 이름을 넣어 주세요" : "");
}

if(window.FB!==undefined) start();
else window.addEventListener("fb-ready", start, {once:true});
setTimeout(()=>{
  if(window.FB===undefined) app().innerHTML=
    `<div class="empty"><p>결과 페이지를 불러오지 못했습니다.</p>
     <p style="font-size:14px">인터넷 연결을 확인하고 새로고침해 주세요.</p></div>`;
},8000);
</script>
